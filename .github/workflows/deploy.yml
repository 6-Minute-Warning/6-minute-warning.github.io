name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y npm@11.19.1 ci
      - run: npx -y npm@11.19.1 run check
      - run: npx -y npm@11.19.1 run lint:ci -w @6mw/app
      - run: npx -y npm@11.19.1 test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx -y npm@11.19.1 run test:rules
      - run: npx -y npm@11.19.1 run build -w @6mw/app

  site:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - run: npx -y npm@11.19.1 ci
      - run: npx -y npm@11.19.1 run build -w @6mw/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  backstage:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          project_id: six-minute-warning
          workload_identity_provider: projects/56775590825/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@six-minute-warning.iam.gserviceaccount.com
      - run: npx -y npm@11.19.1 ci
      - run: npx -y npm@11.19.1 run build -w @6mw/app
      - run: npx -y firebase-tools@15 deploy --only hosting,firestore:rules --project six-minute-warning --non-interactive

  backstage-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          project_id: six-minute-warning
          workload_identity_provider: projects/56775590825/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@six-minute-warning.iam.gserviceaccount.com
      - run: npx -y npm@11.19.1 ci
      - run: npx -y npm@11.19.1 run build -w @6mw/app
      - name: Deploy a preview for this pull request
        run: |
          url=$(npx -y firebase-tools@15 hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project six-minute-warning --expires 14d --json | jq -r '.result["six-minute-warning"].url')
          echo "Backstage preview: $url"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "Backstage preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Let people sign in on the preview
        run: |
          host=${PREVIEW_URL#https://}
          host=${host%/}
          token=$(gcloud auth print-access-token)
          api="https://identitytoolkit.googleapis.com/admin/v2/projects/six-minute-warning/config"
          domains=$(curl -sf -H "Authorization: Bearer $token" -H "x-goog-user-project: six-minute-warning" "$api" | jq -c '.authorizedDomains')
          if echo "$domains" | jq -e --arg h "$host" 'index($h)' > /dev/null; then
            echo "$host can already sign people in."
          else
            updated=$(echo "$domains" | jq -c --arg h "$host" '. + [$h] | unique')
            curl -sf -X PATCH -H "Authorization: Bearer $token" -H "x-goog-user-project: six-minute-warning" \
              -H "Content-Type: application/json" "$api?updateMask=authorizedDomains" -d "{\"authorizedDomains\": $updated}" > /dev/null
            echo "Added $host to the sign-in domains."
          fi

  deploy:
    if: github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  preview-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: six-minute-warning
          workload_identity_provider: projects/56775590825/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@six-minute-warning.iam.gserviceaccount.com
      - name: Remove this pull request's preview
        run: |
          channel="pr-${{ github.event.number }}"
          host=$(npx -y firebase-tools@15 hosting:channel:list --project six-minute-warning --json \
            | jq -r --arg c "$channel" '.result.channels[]? | select(.name | endswith("/" + $c)) | .url' | sed 's|^https://||; s|/$||')
          npx -y firebase-tools@15 hosting:channel:delete "$channel" --project six-minute-warning --force
          if [ -n "$host" ]; then
            token=$(gcloud auth print-access-token)
            api="https://identitytoolkit.googleapis.com/admin/v2/projects/six-minute-warning/config"
            domains=$(curl -sf -H "Authorization: Bearer $token" -H "x-goog-user-project: six-minute-warning" "$api" | jq -c '.authorizedDomains')
            updated=$(echo "$domains" | jq -c --arg h "$host" 'map(select(. != $h))')
            curl -sf -X PATCH -H "Authorization: Bearer $token" -H "x-goog-user-project: six-minute-warning" \
              -H "Content-Type: application/json" "$api?updateMask=authorizedDomains" -d "{\"authorizedDomains\": $updated}" > /dev/null
            echo "Removed $host from the sign-in domains."
          fi
